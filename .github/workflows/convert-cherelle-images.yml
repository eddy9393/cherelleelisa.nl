name: Convert Cherelle section images to WebP

on:
  push:
    branches:
      - main
    paths:
      - "public/Werkwijze.png"
      - "public/Uitnodiging.jpg"
      - ".github/workflows/convert-cherelle-images.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Convert images
        run: |
          if [ -f public/Werkwijze.png ]; then
            cwebp -quiet -q 84 -m 6 public/Werkwijze.png -o public/Werkwijze.webp
          fi

          if [ -f public/Uitnodiging.jpg ]; then
            cwebp -quiet -q 84 -m 6 public/Uitnodiging.jpg -o public/Uitnodiging.webp
          fi

      - name: Replace source images
        run: |
          if [ -f public/Werkwijze.webp ]; then
            git rm -f public/Werkwijze.png
          fi

          if [ -f public/Uitnodiging.webp ]; then
            git rm -f public/Uitnodiging.jpg
          fi

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/Werkwijze.webp public/Uitnodiging.webp
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Convert Werkwijze and Uitnodiging images to WebP"
          git push
